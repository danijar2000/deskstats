name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The version the window and the server show: the tag of a release, the crate's own version otherwise.
  DESKSTATS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  server:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Tests
        working-directory: server
        run: cargo test
      - name: Clippy
        working-directory: server
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Build for Apple silicon and Intel
        working-directory: server
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Window
        working-directory: ui
        run: |
          cargo test
          cargo clippy --release --all-targets -- -D warnings
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      # Pictures of the window as it looks here, to compare with Linux and Windows.
      - name: Window pictures
        run: |
          mkdir -p pictures
          ui/target/aarch64-apple-darwin/release/deskstats-ui --snapshot pictures/macos-dark.png dark
          ui/target/aarch64-apple-darwin/release/deskstats-ui --snapshot pictures/macos-light.png light
          test -s pictures/macos-dark.png && test -s pictures/macos-light.png
      - uses: actions/upload-artifact@v4
        with:
          name: pictures-macos
          path: pictures
      - name: Package
        run: |
          dir=deskstats-server
          mkdir -p "$dir/icon"
          lipo -create -output "$dir/deskstats" \
            server/target/aarch64-apple-darwin/release/deskstats \
            server/target/x86_64-apple-darwin/release/deskstats
          cp server/install.sh "$dir/"
          cp server/icon/AppIcon.icns "$dir/icon/"
          # The version of the tag, as the programs have it; Cargo.toml only for builds without a tag.
          version="${DESKSTATS_VERSION#v}"
          [ -n "$version" ] || version="$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)"
          printf '%s\n' "$version" > "$dir/VERSION"
          lipo -create -output "$dir/deskstats-ui" \
            ui/target/aarch64-apple-darwin/release/deskstats-ui \
            ui/target/x86_64-apple-darwin/release/deskstats-ui
          lipo -info "$dir/deskstats" "$dir/deskstats-ui"
          tar -czf deskstats-server-macos.tar.gz "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: deskstats-server-macos
          path: deskstats-server-macos.tar.gz

  server-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The window links against the C library of the system, so it is built on an older one to run on more.
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust target
        run: rustup target add ${{ matrix.arch }}-unknown-linux-musl
      - name: Tests
        working-directory: server
        run: cargo test
      - name: Clippy
        working-directory: server
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Shell scripts
        run: shellcheck -S warning setup.sh server/install-linux.sh server/install.sh
      # Linked statically against musl, so one program runs on every distribution.
      - name: Build
        working-directory: server
        run: cargo build --release --target ${{ matrix.arch }}-unknown-linux-musl
      # The real program, started and asked like a phone on the cable would ask it.
      - name: Run it
        run: |
          server/target/${{ matrix.arch }}-unknown-linux-musl/release/deskstats 2> server.log &
          sleep 2
          token="$(cat "$HOME/.config/deskstats/token")"
          curl -fsS -H 'X-Deskstats: 1' http://127.0.0.1:8787/info | tee info.json
          grep -q '"app":"deskstats"' info.json
          # A phone asking to be let in over Wi-Fi: the key agreement runs, and the server lives on to answer below.
          curl -fsS -H 'X-Deskstats: 1' 'http://127.0.0.1:8787/pair?k=046b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c2964fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5&n=ci' | tee pair.json
          grep -q '"k":"04[0-9a-f]\{128\}","s":"' pair.json
          curl -s -H "Authorization: Bearer $token" http://127.0.0.1:8787/stats > /dev/null
          sleep 2
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8787/stats | tee stats.json
          grep -q '"os":"linux"' stats.json
          curl -fsS -H "Authorization: Bearer $token" 'http://127.0.0.1:8787/procs?sort=ram' | tee procs.json | head -c 300
          grep -q '"sort":"ram","total":[1-9][0-9]*,"procs":\[{"name":"' procs.json
          kill -TERM "$(pidof deskstats)"
          # It stays up to three seconds more, so that a phone that is reading it learns that it stops.
          for _ in 1 2 3 4 5 6 7 8; do pidof deskstats > /dev/null || break; sleep 1; done
          cat server.log
          if pidof deskstats; then echo 'still running after SIGTERM'; exit 1; fi
      - name: Window
        working-directory: ui
        run: |
          cargo test
          cargo clippy --release --all-targets -- -D warnings
          cargo build --release
      # Drawn in software by Mesa on a virtual screen, like in a virtual machine without a graphics card.
      - name: Window picture
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libxkbcommon-x11-0 > /dev/null
          server/target/${{ matrix.arch }}-unknown-linux-musl/release/deskstats 2> server.log &
          sleep 2
          mkdir -p pictures
          xvfb-run -a -s '-screen 0 1280x1024x24' ui/target/release/deskstats-ui --snapshot pictures/linux-${{ matrix.arch }}-dark.png dark
          xvfb-run -a -s '-screen 0 1280x1024x24' ui/target/release/deskstats-ui --snapshot pictures/linux-${{ matrix.arch }}-light.png light
          kill -TERM "$(pidof deskstats)" || true
          test -s pictures/linux-${{ matrix.arch }}-dark.png
          ldd ui/target/release/deskstats-ui
      - uses: actions/upload-artifact@v4
        with:
          name: pictures-linux-${{ matrix.arch }}
          path: pictures
      - name: Package
        run: |
          dir=deskstats-server
          mkdir -p "$dir"
          cp server/target/${{ matrix.arch }}-unknown-linux-musl/release/deskstats "$dir/"
          cp ui/target/release/deskstats-ui "$dir/"
          cp server/install-linux.sh "$dir/install.sh"
          # The version of the tag, as the programs have it; Cargo.toml only for builds without a tag.
          version="${DESKSTATS_VERSION#v}"
          [ -n "$version" ] || version="$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)"
          printf '%s\n' "$version" > "$dir/VERSION"
          tar -czf deskstats-server-linux-${{ matrix.arch }}.tar.gz "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: deskstats-server-linux-${{ matrix.arch }}
          path: deskstats-server-linux-${{ matrix.arch }}.tar.gz

  server-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        working-directory: server
        run: cargo test
      - name: Clippy
        working-directory: server
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Build
        working-directory: server
        run: cargo build --release
      - name: Window
        working-directory: ui
        run: |
          cargo test
          cargo clippy --release --all-targets -- -D warnings
          cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deskstats-server | Out-Null
          Copy-Item server/target/release/deskstats.exe deskstats-server/
          Copy-Item ui/target/release/deskstats-ui.exe deskstats-server/
          Copy-Item server/install.ps1 deskstats-server/
          Compress-Archive -Path deskstats-server -DestinationPath deskstats-server-windows-x86_64.zip
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($file in 'setup.ps1', 'server/install.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; throw "$file does not parse" }
          }
      # The packaged program, installed by its installer and asked like a phone on the cable would ask it.
      - name: Install it, run it, remove it
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File deskstats-server/install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 failed' }
          if (-not (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name deskstats)) { throw 'does not start at sign-in' }
          $token = (Get-Content "$env:APPDATA\deskstats\token" -Raw).Trim()
          $info = curl.exe -fsS -H 'X-Deskstats: 1' http://127.0.0.1:8787/info
          $info
          if ($info -notmatch '"app":"deskstats"') { throw 'no /info' }
          # A phone asking to be let in over Wi-Fi: the key agreement runs, and the server lives on to answer below.
          $pair = curl.exe -fsS -H 'X-Deskstats: 1' 'http://127.0.0.1:8787/pair?k=046b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c2964fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5&n=ci'
          $pair
          if ($pair -notmatch '"k":"04[0-9a-f]{128}","s":"') { throw 'no /pair' }
          curl.exe -s -H "Authorization: Bearer $token" http://127.0.0.1:8787/stats | Out-Null
          Start-Sleep -Seconds 2
          $stats = curl.exe -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8787/stats
          $stats
          if ($stats -notmatch '"os":"windows"') { throw 'no /stats' }
          $procs = curl.exe -fsS -H "Authorization: Bearer $token" 'http://127.0.0.1:8787/procs?sort=ram'
          $procs.Substring(0, [Math]::Min(300, $procs.Length))
          if ($procs -notmatch '"sort":"ram","total":[1-9][0-9]*,"procs":\[\{"name":"') { throw 'no /procs' }
          Get-Content "$env:APPDATA\deskstats\log.txt"
          if (-not (Test-Path "$env:LOCALAPPDATA\deskstats\deskstats-ui.exe")) { throw 'no window installed' }
          if (-not (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name deskstats-tray)) { throw 'the icon does not start at sign-in' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Deskstats.lnk'))) { throw 'not in the Start menu' }
          # The installer opened the window through Explorer (this runner is an administrator); it is closed first.
          Start-Sleep -Seconds 2
          Get-Process -Name deskstats-ui -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          New-Item -ItemType Directory -Force pictures | Out-Null
          Start-Process -FilePath "$env:LOCALAPPDATA\deskstats\deskstats-ui.exe" -ArgumentList '--snapshot', "$PWD\pictures\windows-dark.png", 'dark' -Wait
          Start-Process -FilePath "$env:LOCALAPPDATA\deskstats\deskstats-ui.exe" -ArgumentList '--snapshot', "$PWD\pictures\windows-light.png", 'light' -Wait
          if (-not (Test-Path pictures\windows-dark.png)) { throw 'the window could not be drawn' }
          powershell -NoProfile -ExecutionPolicy Bypass -File deskstats-server/install.ps1 -Uninstall
          if (Get-Process -Name deskstats -ErrorAction SilentlyContinue) { throw 'still running after uninstall' }
          if (Test-Path "$env:LOCALAPPDATA\deskstats\deskstats.exe") { throw 'not removed' }
          if (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name deskstats -ErrorAction SilentlyContinue) { throw 'still starts at sign-in' }
          if (Get-Process -Name deskstats-ui -ErrorAction SilentlyContinue) { throw 'the window or icon still runs after uninstall' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pictures-windows
          path: pictures
      - uses: actions/upload-artifact@v4
        with:
          name: deskstats-server-windows-x86_64
          path: deskstats-server-windows-x86_64.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Every release is signed with the same key, kept in the secrets of the repository, so that a new release
      # installs over the old one. A build of a tag without the key fails rather than sign with a throwaway one.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DESKSTATS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ -n "$DESKSTATS_VERSION" ]; then
            echo "::error::the secret ANDROID_KEYSTORE_BASE64 is missing: a release must be signed with the release key"
            exit 1
          fi
      - name: Build and lint
        working-directory: android
        env:
          DESKSTATS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DESKSTATS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DESKSTATS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk deskstats.apk
      - uses: actions/upload-artifact@v4
        with:
          name: deskstats-apk
          path: deskstats.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, server-linux, server-windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deskstats-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # setup.sh and setup.ps1 check every download against this list.
          sha256sum deskstats-server-macos.tar.gz deskstats-server-linux-x86_64.tar.gz deskstats-server-linux-aarch64.tar.gz \
            deskstats-server-windows-x86_64.zip deskstats.apk > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" deskstats-server-macos.tar.gz \
            deskstats-server-linux-x86_64.tar.gz deskstats-server-linux-aarch64.tar.gz \
            deskstats-server-windows-x86_64.zip deskstats.apk SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
