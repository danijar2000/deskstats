name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Tests
        working-directory: server
        run: cargo test
      - name: Clippy
        working-directory: server
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Build for Apple silicon and Intel
        working-directory: server
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Package
        run: |
          dir=deskstats-server
          mkdir -p "$dir/icon"
          lipo -create -output "$dir/deskstats" \
            server/target/aarch64-apple-darwin/release/deskstats \
            server/target/x86_64-apple-darwin/release/deskstats
          cp server/install.sh "$dir/"
          cp server/icon/AppIcon.icns "$dir/icon/"
          sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1 > "$dir/VERSION"
          lipo -info "$dir/deskstats"
          tar -czf deskstats-server-macos.tar.gz "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: deskstats-server-macos
          path: deskstats-server-macos.tar.gz

  server-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust target
        run: rustup target add ${{ matrix.arch }}-unknown-linux-musl
      - name: Tests
        working-directory: server
        run: cargo test
      - name: Clippy
        working-directory: server
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Shell scripts
        run: shellcheck -S warning setup.sh server/install-linux.sh server/install.sh
      # Linked statically against musl, so one program runs on every distribution.
      - name: Build
        working-directory: server
        run: cargo build --release --target ${{ matrix.arch }}-unknown-linux-musl
      # The real program, started and asked like a phone on the cable would ask it.
      - name: Run it
        run: |
          server/target/${{ matrix.arch }}-unknown-linux-musl/release/deskstats 2> server.log &
          sleep 2
          token="$(cat "$HOME/.config/deskstats/token")"
          server/target/${{ matrix.arch }}-unknown-linux-musl/release/deskstats --qr https://example.com/app.apk
          test "$(server/target/${{ matrix.arch }}-unknown-linux-musl/release/deskstats --qr-bits https://example.com/app.apk | wc -l)" = 25
          curl -fsS -H 'X-Deskstats: 1' http://127.0.0.1:8787/info | tee info.json
          grep -q '"app":"deskstats"' info.json
          curl -s -H "Authorization: Bearer $token" http://127.0.0.1:8787/stats > /dev/null
          sleep 2
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8787/stats | tee stats.json
          grep -q '"os":"linux"' stats.json
          curl -fsS -H "Authorization: Bearer $token" 'http://127.0.0.1:8787/procs?sort=ram' | tee procs.json | head -c 300
          grep -q '"sort":"ram","total":[1-9][0-9]*,"procs":\[{"name":"' procs.json
          kill -TERM "$(pidof deskstats)"
          # It stays up to three seconds more, so that a phone that is reading it learns that it stops.
          for _ in 1 2 3 4 5 6 7 8; do pidof deskstats > /dev/null || break; sleep 1; done
          cat server.log
          if pidof deskstats; then echo 'still running after SIGTERM'; exit 1; fi
      - name: Package
        run: |
          dir=deskstats-server
          mkdir -p "$dir"
          cp server/target/${{ matrix.arch }}-unknown-linux-musl/release/deskstats "$dir/"
          cp server/install-linux.sh "$dir/install.sh"
          sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1 > "$dir/VERSION"
          tar -czf deskstats-server-linux-${{ matrix.arch }}.tar.gz "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: deskstats-server-linux-${{ matrix.arch }}
          path: deskstats-server-linux-${{ matrix.arch }}.tar.gz

  server-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        working-directory: server
        run: cargo test
      - name: Clippy
        working-directory: server
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Build
        working-directory: server
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deskstats-server | Out-Null
          Copy-Item server/target/release/deskstats.exe deskstats-server/
          Copy-Item server/install.ps1 deskstats-server/
          Compress-Archive -Path deskstats-server -DestinationPath deskstats-server-windows-x86_64.zip
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($file in 'setup.ps1', 'server/install.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; throw "$file does not parse" }
          }
      # The packaged program, installed by its installer and asked like a phone on the cable would ask it.
      - name: Install it, run it, remove it
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File deskstats-server/install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 failed' }
          if (-not (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name deskstats)) { throw 'does not start at sign-in' }
          Start-Process -FilePath "$env:LOCALAPPDATA\deskstats\deskstats.exe" -ArgumentList '--qr-bits', 'https://example.com/app.apk' -Wait -NoNewWindow -RedirectStandardOutput qr.txt
          $rows = @(Get-Content qr.txt)
          if ($rows.Count -ne 25 -or $rows[0] -notmatch '^1111111[01]+1111111$') { throw "no QR code: $rows" }
          $token = (Get-Content "$env:APPDATA\deskstats\token" -Raw).Trim()
          $info = curl.exe -fsS -H 'X-Deskstats: 1' http://127.0.0.1:8787/info
          $info
          if ($info -notmatch '"app":"deskstats"') { throw 'no /info' }
          curl.exe -s -H "Authorization: Bearer $token" http://127.0.0.1:8787/stats | Out-Null
          Start-Sleep -Seconds 2
          $stats = curl.exe -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8787/stats
          $stats
          if ($stats -notmatch '"os":"windows"') { throw 'no /stats' }
          $procs = curl.exe -fsS -H "Authorization: Bearer $token" 'http://127.0.0.1:8787/procs?sort=ram'
          $procs.Substring(0, [Math]::Min(300, $procs.Length))
          if ($procs -notmatch '"sort":"ram","total":[1-9][0-9]*,"procs":\[\{"name":"') { throw 'no /procs' }
          Get-Content "$env:APPDATA\deskstats\log.txt"
          powershell -NoProfile -ExecutionPolicy Bypass -File deskstats-server/install.ps1 -Uninstall
          if (Get-Process -Name deskstats -ErrorAction SilentlyContinue) { throw 'still running after uninstall' }
          if (Test-Path "$env:LOCALAPPDATA\deskstats\deskstats.exe") { throw 'not removed' }
          if (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name deskstats -ErrorAction SilentlyContinue) { throw 'still starts at sign-in' }
      - uses: actions/upload-artifact@v4
        with:
          name: deskstats-server-windows-x86_64
          path: deskstats-server-windows-x86_64.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk deskstats.apk
      - uses: actions/upload-artifact@v4
        with:
          name: deskstats-apk
          path: deskstats.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, server-linux, server-windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" deskstats-server-macos.tar.gz \
            deskstats-server-linux-x86_64.tar.gz deskstats-server-linux-aarch64.tar.gz \
            deskstats-server-windows-x86_64.zip deskstats.apk \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
