<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 750px; overflow: hidden; font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .wall { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 20% 15%, #3b4a8f 0%, transparent 60%), radial-gradient(900px 700px at 85% 80%, #7a3b8f 0%, transparent 60%), linear-gradient(135deg, #1b2240, #2a1f3d 60%, #13182b); }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 28px; background: rgba(20,20,28,.55); backdrop-filter: blur(20px); color: #f2f2f5; font-size: 13.5px; display: flex; align-items: center; padding: 0 14px; gap: 18px; }
  .bar b { font-weight: 700; }
  .bar .right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .icon { width: 26px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
  .icon.on { background: rgba(255,255,255,.28); }
  .win { position: absolute; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.12); }
  .titlebar { height: 30px; display: flex; align-items: center; padding: 0 12px; gap: 8px; font-size: 13px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .term { left: 140px; top: 70px; width: 1000px; height: 560px; background: #1e1f24; }
  .term .titlebar { background: #2b2c31; color: #b8b9c0; }
  .term pre { font-family: Menlo, monospace; font-size: 15.5px; line-height: 1.55; color: #e6e6ea; padding: 16px 18px; white-space: pre-wrap; word-break: break-all; }
  .prompt { color: #7ee787; }
  .say { color: #fff; font-weight: 700; }
  .caret { display: inline-block; width: 9px; height: 18px; background: #e6e6ea; vertical-align: -3px; }
  .set { left: 180px; top: 60px; width: 920px; height: 560px; background: #26272c; color: #ececf0; display: flex; }
  .side { width: 230px; background: #1f2025; padding: 44px 10px 10px; font-size: 13.5px; }
  .side div { padding: 7px 10px; border-radius: 7px; color: #c9c9cf; }
  .side .sel { background: #3a63d8; color: #fff; }
  .main { flex: 1; padding: 22px 28px; }
  .main h1 { font-size: 21px; font-weight: 700; margin: 8px 0 6px; }
  .main p { font-size: 13px; color: #a3a3ab; margin-bottom: 18px; line-height: 1.45; }
  .rows { background: #2f3036; border-radius: 10px; }
  .row { display: flex; align-items: center; padding: 13px 16px; font-size: 14.5px; border-bottom: 1px solid #3b3c43; }
  .row:last-child { border-bottom: 0; }
  .app { width: 26px; height: 26px; border-radius: 7px; margin-right: 12px; display: flex; align-items: center; justify-content: center; }
  .sw { margin-left: auto; width: 40px; height: 24px; border-radius: 12px; background: #55565e; position: relative; transition: none; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
  .sw.on { background: #34c759; }
  .sw.on::after { left: 18px; }
  .cursor { position: absolute; width: 22px; height: 30px; z-index: 50; }
  .caption { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); background: rgba(0,0,0,.6); color: #fff; font-size: 20px; padding: 10px 20px; border-radius: 12px; font-weight: 600; }
</style></head>
<body>
<div class="wall"></div>
<div class="bar"><b id="appname">Terminal</b><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
  <div class="right">
    <div class="icon" id="tray"><svg width="20" height="14" viewBox="0 0 20 14"><polyline points="1,12 5,7 9,9 13,3 19,6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <svg width="18" height="14" viewBox="0 0 18 14"><path d="M9 12.5l2.2-2.6a3 3 0 0 0-4.4 0zM4.6 7.6a6.2 6.2 0 0 1 8.8 0l1.4-1.6a8.4 8.4 0 0 0-11.6 0zM1.6 4.2a10.6 10.6 0 0 1 14.8 0L17.8 2.6a12.8 12.8 0 0 0-17.6 0z" fill="#fff"/></svg>
    <span>Fri 17:12</span>
  </div>
</div>
<div id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const scene = q.get("scene") || "term";
const n = parseFloat(q.get("n") || "0");
const stage = document.getElementById("stage");
const CMD = "curl -fsSL https://raw.githubusercontent.com/danijar2000/deskstats/main/setup.sh | bash";
const OUT = [
  '<span class="say">==&gt; Downloading the server</span>',
  'deskstats is running and starts at login.',
  'Its icon is in the menu bar: a click shows the panel, with Quit at its bottom.',
  '',
  'In System Settings &gt; Privacy &amp; Security allow Deskstats:',
  '  - Full Disk Access (notifications of Mac apps),',
  '  - Accessibility (notifications forwarded from the iPhone).',
  '<span class="say">==&gt; Downloading the phone app</span>',
  '<span class="say">==&gt; Installing the app on the phone</span>',
  'Success',
  '',
  'Done. In a few seconds the computer opens the panel on the phone and pairs it.',
];
const cursor = (x, y) => `<svg class="cursor" style="left:${x}px;top:${y}px" viewBox="0 0 22 30"><path d="M2 2 L2 24 L8 18.5 L12 28 L15.5 26.5 L11.5 17.5 L19 17.5 Z" fill="#fff" stroke="#000" stroke-width="1.5"/></svg>`;
const caption = t => `<div class="caption">${t}</div>`;
if (scene === "term") {
  // n: characters typed; then lines of output after the command (n > CMD.length).
  const typed = Math.min(CMD.length, Math.floor(n));
  const lines = Math.max(0, Math.floor(n - CMD.length));
  let text = `<span class="prompt">~ %</span> ${CMD.slice(0, typed)}`;
  if (lines > 0) text += "\n" + OUT.slice(0, lines).join("\n");
  const done = lines >= OUT.length;
  text += done ? `\n<span class="prompt">~ %</span> <span class="caret"></span>` : (lines > 0 ? "" : '<span class="caret"></span>');
  stage.innerHTML = `<div class="win term"><div class="titlebar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span style="margin-left:auto;margin-right:auto">Terminal — zsh</span></div><pre>${text}</pre></div>` + caption("One command installs it");
} else if (scene === "perm") {
  // n: 0 Full Disk Access off, 1 on; 2 Accessibility off, 3 on.
  document.getElementById("appname").textContent = "System Settings";
  const access = n >= 2;
  const on = n === 1 || n === 3;
  const deskIcon = `<div class="app" style="background:#0f766e"><svg width="18" height="12" viewBox="0 0 20 14"><polyline points="1,12 5,7 9,9 13,3 19,6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  const other = (name, colour, sw) => `<div class="row"><div class="app" style="background:${colour}"></div>${name}<div class="sw ${sw ? "on" : ""}"></div></div>`;
  stage.innerHTML = `<div class="win set"><div class="side"><div>Wi‑Fi</div><div>Bluetooth</div><div>Network</div><div>Notifications</div><div>Sound</div><div>Displays</div><div class="sel">Privacy &amp; Security</div><div>Users &amp; Groups</div></div>
    <div class="main"><div style="font-size:13px;color:#8d8d95">‹ Privacy &amp; Security</div>
    <h1>${access ? "Accessibility" : "Full Disk Access"}</h1>
    <p>${access ? "Allow the apps below to control your computer. Deskstats reads the notifications forwarded from the iPhone." : "Allow the apps below to access data like Mail, Messages and the notifications of other apps."}</p>
    <div class="rows">${other("Terminal", "#3a3b41", true)}<div class="row">${deskIcon}Deskstats<div class="sw ${on ? "on" : ""}"></div></div>${other("Backup", "#5b6b8a", false)}</div></div></div>`
    + cursor(on ? 1032 : 960, on ? 246 : 370) + caption(access ? "Allow Accessibility (iPhone notifications)" : "Allow Full Disk Access (Mac notifications)");
} else if (scene === "desk") {
  // The desktop with the icon pressed: the panel is laid over it from real pictures.
  document.getElementById("appname").textContent = "Finder";
  document.getElementById("tray").classList.add("on");
  stage.innerHTML = cursor(1143, 12) + caption("Click the icon in the menu bar");
} else if (scene === "panel") {
  document.getElementById("appname").textContent = "Finder";
  document.getElementById("tray").classList.add("on");
  stage.innerHTML = `<div class="caption" style="left:38%">Live CPU, memory, disk and network</div>`;
} else if (scene === "plain") {
  document.getElementById("appname").textContent = "Finder";
}
</script>
</body></html>
