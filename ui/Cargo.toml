[package]
name = "deskstats-ui"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"

# The window and the icon by the clock. The server stays a program of its own with nothing of this in it.
[dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "wayland", "x11"] }
sys-locale = "0.3"

# OpenGL draws on macOS and Linux (Mesa draws it in software where there is no graphics card).
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }

# Windows has OpenGL only with a driver of the graphics card, so Direct3D 12 draws there; without a card it falls
# back to the software renderer of Windows (WARP), as in a virtual machine or over Remote Desktop.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = { version = "0.27", default-features = false }
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
